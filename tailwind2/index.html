<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tailwind Responsive</title>
  <!-- Tailwind CSS CDN  -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-slate-700 text-white m-0 p-0">
  <!-- Header Section  -->

  <header class="bg-slate-900 flex justify-between items-center rounded-md">
    <img src="./images/idsjVbV8VY_1764684424808.png" alt="Logo" class="w-16 h-16">

    <div class="group relative">
      <button
        class="bg-purple-500 px-3 py-1 rounded-md text-[24px] font-semibold hover:bg-white cursor-pointer hover:text-fuchsia-600 active:bg-red-500 active:text-white focus:bg-green-500">Menu
        <span class="group-hover:rotate-180 inline-block transition-transform duration-500">▼</span>
      </button>

      <ul
        class="w-[200px] bg-slate-300 text-black rounded-md p-2 font-semibold space-y-2 absolute top-full -left-20 opacity-0 group-hover:opacity-100 text-center transition duration-500 scale-50 group-hover:scale-100 origin-top">
        <li class="bg-slate-400 p-2 rounded-md">Home</li>
        <li class="bg-slate-400 p-2 rounded-md">About us</li>
        <li class="bg-slate-400 p-2 rounded-md">Contact</li>
        <li class="bg-slate-400 p-2 rounded-md">Services</li>
      </ul>
    </div>
  </header>

  <!-- Position -->

  <div class="bg-black rounded-md p-5 mt-4 h-[700px] relative">
    <div class="h-[200px] w-[200px] rounded-md overflow-hidden bg-green-500 absolute bottom-0 right-0">Absolute</div>
    <div class="h-[200px] w-[200px] p-5 rounded-md overflow-hidden bg-purple-500 relative top-16 left-16">Relative</div>
  </div>
</body>

</html>
