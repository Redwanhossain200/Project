<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TailwindCSS</title>

    <!-- Taiwind CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>

  <body>
    <div class="min-h-screen flex items-center justify-center bg-gray-100">
      <h1 class="text-4xl font-bold text-blue-600">Hello, TailwindCSS!</h1>
    </div>

    <div
      class="flex flex-col items-center gap-6 p-7 md:flex-row md:gap-8 rounded-2xl">
      <div>
        <img
          class="size-48 shadow-xl rounded-md bg-no-repeat bg-cover"
          alt=""
          src="https://images.unsplash.com/photo-1507187632231-5beb21a654a2?q=80&w=1201&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" />
      </div>
      <div class="flex items-center md:items-start">
        <span class="text-2xl font-medium">Class Warfare</span>
        <span class="font-medium text-sky-500">The Anti-Patterns</span>
        <span class="flex gap-2 font-medium text-gray-600 dark:text-gray-400">
          <span>No. 4</span>
          <span>·</span>
          <span>2025</span>
        </span>
      </div>
    </div>
  </body>
</html>
